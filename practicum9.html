<!DOCTYPE html>
<html>
<head>
    <title>Bookhive - Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f1ea;
            text-align: center;
        }

        header {
            background-color: #263c50;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #d9a441;
            padding: 12px;
        }

        nav a {
            color: #263c50;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        /* Text Sliding Effect */
        .slide-text {
            color: #263c50;
            font-size: 25px;
            font-weight: bold;
            animation: slide 4s ease-in-out infinite alternate;
        }

        @keyframes slide {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }

        /* Book Image */
        .book-container {
            margin: 25px auto;
            width: 80%;
        }

        .book-container img {
            width: 100%;
            max-width: 400px;
            height: auto;
            object-fit: cover;
            border-radius: 12px;
            animation: zoom 3s ease-in-out infinite alternate;
        }

        @keyframes zoom {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.08);
            }
        }

        /* Animated Button */
        button {
            background-color: #263c50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            animation: move 2s ease-in-out infinite alternate;
        }

        button:hover {
            background-color: #d9a441;
            color: black;
        }

        @keyframes move {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-10px);
            }
        }

        /* Phone Responsive Design */
        @media screen and (max-width: 600px) {

            header {
                font-size: 14px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
                font-size: 13px;
            }

            .slide-text {
                font-size: 18px;
            }

            .book-container {
                width: 95%;
            }

            .book-container img {
                width: 100%;
                height: auto;
            }

            button {
                padding: 10px 18px;
            }
        }

    </style>
</head>

<body>

    <header>
        <h1>BOOKHIVE</h1>
        <p>Digital Library and Book Subscription Services</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Books</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <h2 class="slide-text">
        Welcome to Bookhive!
    </h2>

    <p>Explore thousands of books and discover your next favourite story.</p>

    <div class="book-container">
        <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=600"
             alt="Books in Bookhive Library">
    </div>

    <h2>Discover. Read. Enjoy.</h2>

    <p>Subscribe to Bookhive and enjoy unlimited reading.</p>

    <button>Explore Books</button>

</body>
</html>
